# rhwp-studio 를 s3://mindlogic-webhwp/rhwp/ 로 배포한다.
# CDN: webhwp.mindlogic-api.com (CloudFront E3P04SMU1DWDVP).
#
# Variables: AWS_REGION, S3_BUCKET, CF_DISTRIBUTION_ID, AWS_ACCESS_KEY_ID
# Secrets: AWS_SECRET_ACCESS_KEY
#
# 배포 단위는 기존 수동 배포 규칙을 그대로 따른다 — rhwp/v<패키지버전>-<빌드번호>/.
# 각 디렉토리는 자기완결적이고 한 번 쓰면 바뀌지 않는다. 그 위에 rhwp/latest/ 를
# 두어 소비자가 배포마다 URL 을 바꾸지 않아도 되게 한다.
name: Deploy studio to S3

on:
  push:
    branches: [mindlogic/main]
    paths-ignore:
      - 'mydocs/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'rhwp-logo.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-s3
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.S3_BUCKET }}
      PREFIX: rhwp

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve version
        run: |
          set -euo pipefail
          ver=$(jq -r .version rhwp-studio/package.json)
          last=$(aws s3 ls "s3://${BUCKET}/${PREFIX}/" \
            | sed -n "s#.*PRE v${ver}-\([0-9]\{1,\}\)/#\1#p" | sort -n | tail -1)
          version="v${ver}-$(( ${last:-0} + 1 ))"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "BASE_PATH=/${PREFIX}/${version}/" >> "$GITHUB_ENV"
          echo "배포 대상: ${PREFIX}/${version}/"

      # 잡에서 가장 오래 걸리는 구간이라 산출물째 캐시한다. cargo 캐시만으로는
      # 부족하다 — checkout 이 mtime 을 새로 찍어 fingerprint 가 깨지고, 소스가
      # 같아도 상당수 크레이트를 다시 컴파일한다.
      #
      # restore-keys 는 일부러 없다. 부분 일치로 옛 pkg/ 를 복원하면 소스와 다른
      # 엔진이 조용히 배포된다.
      - name: Cache built WASM
        id: wasm-artifact
        uses: actions/cache@v6
        with:
          path: pkg
          key: wasm-pkg-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'saved/**', 'assets/logo/**', '.github/actions/install-wasm-pack/action.yml') }}

      - name: Install Rust toolchain
        if: steps.wasm-artifact.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.wasm-artifact.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-wasm-pack

      - name: Cache cargo registry & build
        if: steps.wasm-artifact.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build WASM
        if: steps.wasm-artifact.outputs.cache-hit != 'true'
        run: wasm-pack build --target web --release

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: rhwp-studio
        run: npm ci

      - name: Copy favicon
        run: cp assets/logo/favicon.ico rhwp-studio/public/favicon.ico

      - name: Build rhwp-studio
        working-directory: rhwp-studio
        run: npx vite build --base="${BASE_PATH}"

      - name: Upload to version directory
        run: |
          dest="s3://${BUCKET}/${PREFIX}/${VERSION}"
          aws s3 sync rhwp-studio/dist "${dest}" \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync rhwp-studio/dist "${dest}" \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache,must-revalidate"

      # latest/ 는 방금 만든 버전 디렉토리의 거울이다. index.html 을 맨 마지막에
      # 옮기는 이유는, 그 문서가 같은 디렉토리의 agent-bridge.js·fonts/ 를 상대
      # 경로로 부르기 때문이다. 먼저 바뀌면 그 사이 방문자가 새 문서 + 옛 브리지를
      # 받는다. 해시 자산은 index.html 이 버전 경로로 절대 참조하므로 무관하다.
      - name: Mirror to latest
        run: |
          src="s3://${BUCKET}/${PREFIX}/${VERSION}"
          dest="s3://${BUCKET}/${PREFIX}/latest"
          aws s3 sync "${src}" "${dest}" --delete --exclude "index.html"
          aws s3 cp "${src}/index.html" "${dest}/index.html"

      - name: Invalidate CloudFront
        env:
          DIST_ID: ${{ vars.CF_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DIST_ID}" \
            --paths "/${PREFIX}/latest/*"

      - name: Summary
        run: |
          {
            echo "### 배포 완료"
            echo
            echo "- 버전: \`${PREFIX}/${VERSION}/\`"
            echo "- https://webhwp.mindlogic-api.com/${PREFIX}/latest/"
            echo "- 롤백: rollback-studio-s3.yml 을 \`version=${VERSION}\` 으로 실행"
          } >> "$GITHUB_STEP_SUMMARY"
